name: Generate Malay recorded voice

on:
  workflow_dispatch:
    inputs:
      speaker:
        description: TTS speaker voice
        default: idayu
      only:
        description: Comma-separated ogg names to (re)generate, empty = all missing
        default: ""
      force:
        description: Regenerate even if the wav already exists
        default: ""
      seed:
        description: Random seed for reproducible takes, empty = random
        default: ""
      temperature:
        description: Sampling temperature, lower is calmer (default 0.7)
        default: ""
      shards:
        description: Parallel synth jobs
        default: "5"

jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System audio deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y espeak-ng espeak-ng-data sox vorbis-tools ffmpeg zip

      - name: Python deps (CPU torch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate soundfile librosa nltk pyyaml munch pydub tqdm einops matplotlib phonemizer huggingface_hub "git+https://github.com/mesolitica/DistilCodec" wandb tensorboard vector_quantize_pytorch
          python patch_codec.py

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: ms-voice-models-v1

      - name: Cache generated wavs (resume across runs)
        uses: actions/cache@v4
        with:
          path: wavs
          key: ms-voice-wavs-${{ matrix.shard }}-${{ hashFiles('manifest.json') }}

      - name: Download models
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          snapshot_download("mesolitica/Malaysian-TTS-0.6B-v1", local_dir="models/qwen-tts",
                            allow_patterns=["*.json", "*.txt", "*.jinja", "*.safetensors"])
          snapshot_download("IDEA-Emdoor/DistilCodec-v1.0", local_dir="models/distilcodec",
                            allow_patterns=["model_config.json", "g_00204000"])
          EOF

      - name: Synthesize shard clips
        run: python synth.py --speaker "${{ inputs.speaker }}" --only "${{ inputs.only }}" --shard "${{ matrix.shard }}/${{ inputs.shards }}" ${{ inputs.force != '' && '--force' || '' }} ${{ inputs.seed != '' && format('--seed {0}', inputs.seed) || '' }} ${{ inputs.temperature != '' && format('--temperature {0}', inputs.temperature) || '' }}

      - name: Post-process shard to ogg
        run: |
          shopt -s nullglob
          mkdir -p shard_oggs
          wavs=(wavs/*.wav)
          if [ ${#wavs[@]} -eq 0 ]; then echo "no wavs in this shard, skipping"; exit 0; fi
          for w in "${wavs[@]}"; do
            base=$(basename "$w" .wav)
            ffmpeg -y -loglevel error -i "$w" -af \
              "silenceremove=start_periods=1:start_duration=0.1:start_threshold=-50dB,areverse,silenceremove=start_periods=1:start_duration=0.1:start_threshold=-50dB,areverse,atempo=0.85,loudnorm=I=-16:TP=-1.5:LRA=11" \
              -c:a libvorbis -q:a 4 "shard_oggs/$base.ogg"
          done
          ls shard_oggs | wc -l

      - name: Upload shard oggs
        if: hashFiles('shard_oggs/*.ogg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: oggs-shard-${{ matrix.shard }}
          path: shard_oggs/*.ogg

  pack:
    runs-on: ubuntu-latest
    needs: synth
    steps:
      - uses: actions/checkout@v4

      - name: Merge shard oggs
        uses: actions/download-artifact@v4
        with:
          pattern: oggs-shard-*
          path: voice/ms/voice
          merge-multiple: true

      - name: Package ms_0.voice.zip
        run: |
          sudo apt-get update -y && sudo apt-get install -y zip
          mkdir -p voice/ms/voice flat
          cp ms_tts.js voice/ms/ms_tts.js
          touch voice/ms/.nomedia
          ls voice/ms/voice | wc -l
          # Flat entries: the app extracts voice zips into voice/<lang>/,
          # so paths inside the zip must be flat (see gen_voice.sh upstream).
          cp voice/ms/voice/*.ogg voice/ms/ms_tts.js voice/ms/.nomedia flat/
          rm -f ms_0.voice.zip
          cd flat
          echo "Voice Data Malay (ms)" | zip ../ms_0.voice.zip ms_tts.js -c
          zip ../ms_0.voice.zip *.ogg .nomedia
          ls -l ../ms_0.voice.zip

      - name: Upload pack
        uses: actions/upload-artifact@v4
        with:
          name: ms-voice-pack
          path: |
            ms_0.voice.zip
            voice/ms/voice/*.ogg
